variables:
  NODE_VERSION: 18

include:
  - project: common/templates/ci-microservices
    ref: 'feature/PI-6454'
    file:
      - library-ci.yaml
    inputs:
      package_json_dir: 'src'
  - project: 'pi-ecommerce/cms/cms-template-ci'
    ref: '1.4.0'
    file: 'github.yaml'

stages:
  - build
  - test
  - post-tests
  - mutation
  - review
  - documentation
  - deploy

test-unit:
  extends: .test-jest
  variables:
    TEST_TYPE: 'unit'

.npm-publish-template:
  needs: [install]
  before_script:
    - cp *.md src/
    - export NPM_REGISTRY_TOKEN=$NPM_REGISTRY_PUSH_TOKEN
  script:
    - echo $NPM_REGISTRY_TOKEN
    - cd src/
    - echo $PKG_VERSION
    - echo $PKG_TAG
    - npm --no-git-tag-version --allow-same-version version $PKG_VERSION
    - npm publish --access public --tag $PKG_TAG

trigger-github-workflow:
  stage: documentation
  needs:
    - release-note-jira
